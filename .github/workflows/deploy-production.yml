name: Deploy Bio Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bio-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Verify Node.js runtime
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 26) process.exit(1)'

      - run: npm ci
      - run: npm run build

      - name: Configure restricted production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 0600 .github/known_hosts "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519"

      - name: Push immutable commit to production Git
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          git remote add production "work@${DEPLOY_HOST}:/home/work/git/bio.git"
          git push production "HEAD:refs/heads/main"

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          ssh "work@${DEPLOY_HOST}" \
            "/home/work/bin/deploy-portfolio.sh bio ${GITHUB_SHA}"
